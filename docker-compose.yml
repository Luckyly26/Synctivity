services:
  postgres:
    image: postgres:16-alpine
    container_name: synctivity-postgres
    environment:
      POSTGRES_DB: synctivity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d synctivity_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  electric:
    image: electricsql/electric:latest
    container_name: synctivity-electric
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/synctivity_db?sslmode=disable
      ELECTRIC_SECRET: ${ELECTRIC_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: